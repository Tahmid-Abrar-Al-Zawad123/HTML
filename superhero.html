<!DOCTYLE html>
<html>
    <head>
      <title>thunder kid</title>
      <style>
      body {
        background-color: darkblue;
        color: white;
        font-family: arial, sans-serif;
      }

      .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orange;
        }

        .tagline {
          font-style: italic;
          color: lightblue;
          text-transform: capitalize;
        }

        .label {
          text-transform: uppercase;
          text-decoration: underline;
          color: coral;
        }

        .weaknesses {
            text-decoration: line-through;
            color: gray;
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        .power {
          font-weight: bold;
          color: gold;
          transform: rotate(15deg);
        }

        .made-by {
          color: coral;
          font-style: italic;
        }
      </style>
    </head>
    <body>

        <h1 class="hero name">Thunder Kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <p class="power">Can lift a school bus</p>

        <h2 class="label">weaknesses</h2>
        <p class="weaknesses">maths homework</p>
        <p class="weaknesses">broccoli</p>

        <p class="badge">top hero</p>

        <P class="made-by"> created by Tahmid Abrar Al Zawad</p>

    </body>
</html>
