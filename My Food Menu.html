<DOCTYPE html>
<html>
  <head>
    <title>My Food Menu</title>
    <style>
      body {
        font-family: Arial;
        background: lightblue;
        padding: 30px;
        text-align: center;
      }

      h1 { color: white; }

      h1 + p {
        background: blue;
        padding: 10px 20px;
        border-radius: 8px;
        color: white;
        display: inline-block;
      }

      ul { padding: 0; margin-top: 20px; }

      ul > li {
        list-style: none;
        font-size: 18px;
        font-weight: bold;
        color: #5d4037;
        padding: 10px 20px;
        margin: 6px auto;
        width: 260px;
        background: orange;
        border-radius: 8px;
      }

      ul li:nth-child(3) {
          background: yellow;
          color: black;
      }

      .desc {
          color: #555;
          margin-top: 20px;
          font-size: 15px;
          max-width: 400px;
          margin-left: auto;
          margin-right: auto;
      }

      .desc::first-letter {
          font-size: 220%;
          color: white;
          font-weight: bold;
      }

      .links {
          margin-top: 25px;
      }

      a {
          color: white;
          text-decoration: none;
          font-size: 15px;
          margin: 0 12px;
          padding: 8px 12px;
          border: 2px solid white;
          border-radius: 8px;
      }

      a:hover {
          background: white;
          color: orange;
      }
    </style>
  </head>
  <body>
    <h1>My Food Menu</h1>
    <p>Pick Your Favourite Dish And Dig In!</p>

    <ul>
      <li>Pizza</li>
      <li>Burger</li>
      <li>Tacos ~ Chef's Special!</li>
      <li>Noodles</li>
      <li>Ice cream</li>
    </ul>
    <p class="desc">Every dish on thid menu is made with love and loads of flavour. Try them all and find your favourite!</p>

    <div class="links">
      <a href="#">Order Now</a>
      <a href="#">See More</a>
    </div>
  </body>
</html>
