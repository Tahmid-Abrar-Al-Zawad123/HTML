<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Loops</title>
</head>
<body>
	<h1>Fruits</h1>
	<div id = "res"></div>
	<script>

	var fruit = ["banana","apple","orange","jack fruit","custard apple"]
	var res = "<br>";
	for(var i = 0; i<fruit.length;i++){
	    res = res + fruit[i] + "<br>"
	}
	document.getElementById("res").innerHTML = res
	</script>
</body>
</html>
