<html>
  <head><title>Function in JS</title></head>
  <body>
    <button onclick = "mult(2,88);">Click Me</button>
    <div id = "result"></div>
    <script>
      function mult(x,y){
        if (y == undefined){
          y = 10
        }
        document.getElementById("result").innerHTML = "The result is" + (x*y)
      }
    </script>
  </body>
</html>
