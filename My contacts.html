<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Objects in JS</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	<style>
	    body {
					background-color: orange;
					}
		div {
		background-color: black;
		color: white;
		}
	</style>
</head>
<body>
    <h1>Object in JS</h1>
    <div id = "container m-3 bg-primary">
        <div id = "nameid"></div>
        <div id = "phoneid"></div>
        <div id = "schoolid"></div>
        <div id = "cityid"></div>
    </div>
    <script>
      var mycontact = {
        name : "Tahmid Abrar Al Zawad",
        phone : "01319-072695",
        school : "Unknown Academy",
        city : "Nageswari"
      }
      document.getElementById("nameid").innerHTML = "Name : " +mycontact.name
      document.getElementById("phoneid").innerHTML = "Phone : " +mycontact.phone
      document.getElementById("schoolid").innerHTML = "school : " +mycontact["school"]
      document.getElementById("cityid").innerHTML = "city : " +mycontact["city"]
    </script>
</body>
</html>
